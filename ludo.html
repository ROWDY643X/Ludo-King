<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Custom Ludo</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  background:#202020;
  color:white;
  font-family:Arial,sans-serif;
  text-align:center;
}

h1{margin:12px 0 4px}

#turn{
  font-size:18px;
  margin:6px;
}

#message{
  min-height:25px;
  margin:6px;
  font-weight:bold;
}

.board{
  position:relative;
  width:94vw;
  max-width:520px;
  aspect-ratio:1;
  margin:10px auto;
  background:white;
  border:5px solid #111;
  overflow:hidden;
}

/* Four home areas */

.home{
  position:absolute;
  width:40%;
  height:40%;
  padding:8%;
  display:grid;
  grid-template-columns:1fr 1fr;
  grid-template-rows:1fr 1fr;
  gap:10px;
}

.redHome{
  left:0;
  top:0;
  background:#e53935;
}

.greenHome{
  right:0;
  top:0;
  background:#43a047;
}

.blueHome{
  left:0;
  bottom:0;
  background:#1e88e5;
}

.yellowHome{
  right:0;
  bottom:0;
  background:#fbc02d;
}

.base{
  background:white;
  border-radius:50%;
  border:3px solid #333;
  position:relative;
}

/* Playing track */

.track{
  position:absolute;
  left:20%;
  top:20%;
  width:60%;
  height:60%;
  background:#eee;
  border:2px solid #222;
}

/* Centre */

.center{
  position:absolute;
  left:40%;
  top:40%;
  width:20%;
  height:20%;
  background:conic-gradient(
    #e53935 0 25%,
    #43a047 25% 50%,
    #fbc02d 50% 75%,
    #1e88e5 75% 100%
  );
  border:2px solid #222;
}

/* Track cells */

.cell{
  position:absolute;
  width:6%;
  height:6%;
  background:white;
  border:1px solid #999;
}

.safe{
  background:#fff4b0;
}

.token{
  position:absolute;
  width:6%;
  height:6%;
  border-radius:50%;
  border:3px solid white;
  box-shadow:0 2px 5px #555;
  z-index:20;
  cursor:pointer;
  transform:translate(-50%,-50%);
}

.red{background:#e53935}
.green{background:#43a047}
.blue{background:#1e88e5}
.yellow{background:#fbc02d}

button{
  border:0;
  border-radius:12px;
  padding:14px 30px;
  font-size:20px;
  font-weight:bold;
}

#dice{
  font-size:52px;
  height:60px;
}

#number{
  font-size:20px;
  font-weight:bold;
}
</style>
</head>

<body>

<h1>🎲 Custom Ludo</h1>

<div id="turn"></div>
<div id="message">Roll the dice.</div>

<div class="board" id="board">

  <div class="home redHome">
    <div class="base"></div>
    <div class="base"></div>
    <div class="base"></div>
    <div class="base"></div>
  </div>

  <div class="home greenHome">
    <div class="base"></div>
    <div class="base"></div>
    <div class="base"></div>
    <div class="base"></div>
  </div>

  <div class="home blueHome">
    <div class="base"></div>
    <div class="base"></div>
    <div class="base"></div>
    <div class="base"></div>
  </div>

  <div class="home yellowHome">
    <div class="base"></div>
    <div class="base"></div>
    <div class="base"></div>
    <div class="base"></div>
  </div>

  <div class="track"></div>
  <div class="center"></div>

</div>

<div id="dice">🎲</div>
<div id="number"></div>

<button id="roll">ROLL DICE</button>

<script>

/* =========================
   PLAYERS
========================= */

const players=[
  "RED",
  "GREEN",
  "YELLOW",
  "BLUE"
];

let playerTurn=0;
let dice=0;
let waitingForToken=false;
let winner=null;


/* =========================
   TOKENS
========================= */

const tokens={
  RED:[-1,-1,-1,-1],
  GREEN:[-1,-1,-1,-1],
  YELLOW:[-1,-1,-1,-1],
  BLUE:[-1,-1,-1,-1]
};


/*
-1 = inside home
0-51 = position on track
52 = finished
*/


/* =========================
   52 TRACK POSITIONS
========================= */

const path=[];

/* Top */

for(let x=23;x<=77;x+=6){
  path.push([x,23]);
}

/* Right */

for(let y=29;y<=77;y+=6){
  path.push([77,y]);
}

/* Bottom */

for(let x=71;x>=23;x-=6){
  path.push([x,77]);
}

/* Left */

for(let y=71;y>=29;y-=6){
  path.push([23,y]);
}


/*
Complete remaining positions around
the middle.
*/

while(path.length<52){

  const n=path.length;

  const angle=(Math.PI*2*n)/52;

  const x=50+27*Math.cos(angle);
  const y=50+27*Math.sin(angle);

  path.push([x,y]);
}


/* =========================
   HOME POSITIONS
========================= */

const homePositions={

  RED:[
    [10,10],
    [17,10],
    [10,17],
    [17,17]
  ],

  GREEN:[
    [83,10],
    [90,10],
    [83,17],
    [90,17]
  ],

  BLUE:[
    [10,83],
    [17,83],
    [10,90],
    [17,90]
  ],

  YELLOW:[
    [83,83],
    [90,83],
    [83,90],
    [90,90]
  ]

};


/* =========================
   START POSITIONS
========================= */

const starts={
  RED:0,
  GREEN:13,
  YELLOW:26,
  BLUE:39
};


/* =========================
   DRAW TOKENS
========================= */

function drawTokens(){

  document
    .querySelectorAll(".token")
    .forEach(t=>t.remove());

  players.forEach(colour=>{

    for(let i=0;i<4;i++){

      const position=tokens[colour][i];

      let x,y;

      if(position===-1){

        [x,y]=homePositions[colour][i];

      }else if(position>=52){

        [x,y]=[50,50];

      }else{

        const index=
          (starts[colour]+position)%52;

        [x,y]=path[index];

      }

      const token=document.createElement("div");

      token.className=
        "token "+colour.toLowerCase();

      token.style.left=x+"%";
      token.style.top=y+"%";

      token.dataset.colour=colour;
      token.dataset.index=i;

      token.onclick=function(){

        chooseToken(
          colour,
          Number(this.dataset.index)
        );

      };

      document
        .getElementById("board")
        .appendChild(token);

    }

  });

  document.getElementById("turn").textContent=
    "Turn: "+players[playerTurn];

}


/* =========================
   ROLL DICE
========================= */

document.getElementById("roll").onclick=function(){

  if(winner){
    return;
  }

  if(waitingForToken){

    document.getElementById("message").textContent=
      "Tap one of your tokens.";

    return;

  }

  dice=
    Math.floor(Math.random()*6)+1;

  document.getElementById("dice").textContent=
    ["","⚀","⚁","⚂","⚃","⚄","⚅"][dice];

  document.getElementById("number").textContent=
    "You rolled: "+dice;

  waitingForToken=true;

  document.getElementById("message").textContent=
    "Tap a "+players[playerTurn]+" token.";

};


/* =========================
   CHOOSE TOKEN
========================= */

function chooseToken(colour,index){

  if(winner){
    return;
  }

  if(!waitingForToken){
    return;
  }

  if(colour!==players[playerTurn]){

    document.getElementById("message").textContent=
      "It's "+players[playerTurn]+"'s turn.";

    return;

  }

  const current=tokens[colour][index];


  /* Token inside home */

  if(current===-1){

    if(dice!==6){

      document.getElementById("message").textContent=
        "You need a 6 to bring this token out.";

      return;

    }

    tokens[colour][index]=0;

  }

  /* Token already moving */

  else{

    const next=current+dice;

    if(next>52){

      document.getElementById("message").textContent=
        "That token cannot move that far.";

      return;

    }

    tokens[colour][index]=next;

  }


  /* Finish */

  if(tokens[colour][index]>=52){

    tokens[colour][index]=52;

  }


  /* Capture */

  capture(colour,index);


  waitingForToken=false;

  drawTokens();


  /* Check winner */

  if(
    tokens[colour].every(
      position=>position===52
    )
  ){

    winner=colour;

    document.getElementById("message").textContent=
      "🏆 "+colour+" WINS!";

    document.getElementById("roll").disabled=true;

    return;

  }


  /* Extra turn on 6 */

  if(dice===6){

    document.getElementById("message").textContent=
      colour+" gets another turn! Roll again.";

    return;

  }


  /* Next player */

  playerTurn=
    (playerTurn+1)%players.length;

  document.getElementById("message").textContent=
    "Now it's "+players[playerTurn]+"'s turn.";

  drawTokens();

}


/* =========================
   CAPTURE
========================= */

function capture(colour,index){

  const position=tokens[colour][index];

  if(position<0 || position>=52){
    return;
  }

  const absolute=
    (starts[colour]+position)%52;

  players.forEach(other=>{

    if(other===colour){
      return;
    }

    for(let i=0;i<4;i++){

      const otherPosition=tokens[other][i];

      if(
        otherPosition>=0 &&
        otherPosition<52
      ){

        const otherAbsolute=
          (starts[other]+otherPosition)%52;

        if(otherAbsolute===absolute){

          /*
          Send captured token back home.
          */

          tokens[other][i]=-1;

        }

      }

    }

  });

}


/* =========================
   START GAME
========================= */

drawTokens();

</script>

</body>
</html>
