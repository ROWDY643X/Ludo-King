<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Custom Ludo</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  background:#202020;
  font-family:Arial,sans-serif;
  text-align:center;
  color:white;
}

h1{margin:12px 0 5px}

#info{
  margin:5px;
  font-size:17px;
}

.board{
  width:min(94vw,520px);
  aspect-ratio:1;
  margin:12px auto;
  display:grid;
  grid-template-columns:repeat(15,1fr);
  grid-template-rows:repeat(15,1fr);
  background:white;
  border:5px solid #111;
  position:relative;
}

.cell{
  border:1px solid #aaa;
  display:flex;
  align-items:center;
  justify-content:center;
  position:relative;
}

.redHome{background:#e53935}
.greenHome{background:#43a047}
.yellowHome{background:#fbc02d}
.blueHome{background:#1e88e5}

.path{background:white}

.redPath{background:#ffcdd2}
.greenPath{background:#c8e6c9}
.yellowPath{background:#fff9c4}
.bluePath{background:#bbdefb}

.center{
  background:linear-gradient(
    45deg,
    #e53935 0 25%,
    #43a047 25% 50%,
    #fbc02d 50% 75%,
    #1e88e5 75%
  );
}

.token{
  width:72%;
  height:72%;
  border-radius:50%;
  border:3px solid white;
  box-shadow:0 2px 4px #555;
  cursor:pointer;
  z-index:10;
}

.red{background:#e53935}
.green{background:#43a047}
.yellow{background:#fbc02d}
.blue{background:#1e88e5}

#dice{
  font-size:55px;
  height:65px;
}

button{
  border:0;
  border-radius:12px;
  padding:14px 30px;
  font-size:20px;
  font-weight:bold;
}

#message{
  min-height:25px;
  margin:10px;
  font-weight:bold;
}
</style>
</head>

<body>

<h1>🎲 Custom Ludo</h1>

<div id="info"></div>

<div class="board" id="board"></div>

<div id="dice">🎲</div>

<button id="roll">ROLL DICE</button>

<div id="message">Roll the dice to start.</div>

<script>

/* =========================
   GAME SETTINGS
========================= */

const colours=["RED","GREEN","YELLOW","BLUE"];

const css={
 RED:"red",
 GREEN:"green",
 YELLOW:"yellow",
 BLUE:"blue"
};

let selectedColour=
  localStorage.getItem("selectedColour") || "RED";

let currentPlayer=0;
let dice=0;
let rolled=false;

const pieces={
 RED:[-1,-1,-1,-1],
 GREEN:[-1,-1,-1,-1],
 YELLOW:[-1,-1,-1,-1],
 BLUE:[-1,-1,-1,-1]
};

let winner=null;


/* =========================
   BOARD TRACK
========================= */

const track=[];

for(let c=1;c<=15;c++) track.push([8,c]);
for(let r=9;r<=15;r++) track.push([r,15]);
for(let c=14;c>=1;c--) track.push([15,c]);
for(let r=14;r>=1;r--) track.push([r,1]);

/*
This gives us a simple circular track.
The home paths are handled separately.
*/


/* =========================
   CREATE BOARD
========================= */

const board=document.getElementById("board");

function makeCell(r,c,className="cell"){

  const d=document.createElement("div");

  d.className=className;

  d.style.gridRow=r;
  d.style.gridColumn=c;

  board.appendChild(d);

  return d;
}


/* Four home areas */

for(let r=1;r<=15;r++){

  for(let c=1;c<=15;c++){

    let home=false;

    if(r<=6 && c<=6) home=true;
    if(r<=6 && c>=10) home=true;
    if(r>=10 && c<=6) home=true;
    if(r>=10 && c>=10) home=true;

    if(home){

      let cls="cell ";

      if(r<=6 && c<=6) cls+="redHome";
      else if(r<=6 && c>=10) cls+="greenHome";
      else if(r>=10 && c<=6) cls+="blueHome";
      else cls+="yellowHome";

      makeCell(r,c,cls);

    }else{

      makeCell(r,c,"cell path");

    }

  }
}


/* Colour the main lanes */

for(let i=0;i<track.length;i++){

  const [r,c]=track[i];

  const cells=document.querySelectorAll(".cell");

  const index=(r-1)*15+(c-1);

  if(cells[index]){
    cells[index].classList.add(
      css[colours[i%4]]+"Path"
    );
  }
}


/* Center */

const center=document.createElement("div");

center.className="center";

center.style.gridRow="7 / 10";
center.style.gridColumn="7 / 10";

board.appendChild(center);


/* =========================
   TOKEN DISPLAY
========================= */

function drawTokens(){

  document.querySelectorAll(".token").forEach(t=>t.remove());

  colours.forEach(colour=>{

    for(let i=0;i<4;i++){

      const position=pieces[colour][i];

      let cell;

      if(position===-1){

        /*
        Token is still inside its home area.
        */

        const homePositions={
          RED:[[2,2],[2,5],[5,2],[5,5]],
          GREEN:[[2,11],[2,14],[5,11],[5,14]],
          BLUE:[[11,2],[11,5],[14,2],[14,5]],
          YELLOW:[[11,11],[11,14],[14,11],[14,14]]
        };

        const [r,c]=homePositions[colour][i];

        cell=document.querySelector(
          `.cell:nth-child(${(r-1)*15+c})`
        );

      }else{

        const [r,c]=track[
          (startIndex[colour]+position)%track.length
        ];

        cell=document.querySelector(
          `.cell:nth-child(${(r-1)*15+c})`
        );

      }

      if(cell){

        const token=document.createElement("div");

        token.className="token "+css[colour];

        token.dataset.colour=colour;
        token.dataset.index=i;

        token.onclick=()=>{
          moveToken(colour,i);
        };

        cell.appendChild(token);

      }

    }

  });

}


/* Starting positions */

const startIndex={
 RED:0,
 GREEN:10,
 YELLOW:20,
 BLUE:30
};


/* =========================
   PLAYER INFO
========================= */

function updateInfo(){

  const player=colours[currentPlayer];

  document.getElementById("info").textContent=
    "Turn: "+player+
    " | Selected: "+selectedColour;

}

updateInfo();
drawTokens();


/* =========================
   DICE
========================= */

document.getElementById("roll").onclick=()=>{

  if(winner) return;

  if(rolled){

    document.getElementById("message").textContent=
      "Choose a "+colours[currentPlayer]+" token.";

    return;

  }

  dice=Math.floor(Math.random()*6)+1;

  document.getElementById("dice").textContent=
    ["","⚀","⚁","⚂","⚃","⚄","⚅"][dice];

  rolled=true;

  document.getElementById("message").textContent=
    colours[currentPlayer]+
    " rolled "+dice+
    ". Choose a token.";

};


/* =========================
   MOVE TOKEN
========================= */

function moveToken(colour,index){

  if(winner) return;

  if(!rolled) return;

  if(colour!==colours[currentPlayer]){

    document.getElementById("message").textContent=
      "It's "+colours[currentPlayer]+"'s turn.";

    return;

  }

  const position=pieces[colour][index];

  /*
  Need a 6 to leave home.
  */

  if(position===-1){

    if(dice!==6){

      document.getElementById("message").textContent=
        "You need a 6 to bring this token out.";

      return;

    }

    pieces[colour][index]=0;

  }else{

    const newPosition=position+dice;

    if(newPosition>track.length){

      document.getElementById("message").textContent=
        "That token cannot move that far.";

      return;

    }

    pieces[colour][index]=newPosition;

  }

  rolled=false;

  capture(colour,index);

  drawTokens();

  checkWinner(colour);

  if(winner) return;

  /*
  A 6 gives another turn.
  */

  if(dice===6){

    document.getElementById("message").textContent=
      colour+" gets another turn!";

  }else{

    currentPlayer=
      (currentPlayer+1)%colours.length;

    updateInfo();

    document.getElementById("message").textContent=
      "Now it's "+colours[currentPlayer]+"'s turn.";

  }

}


/* =========================
   CAPTURE
========================= */

function capture(colour,index){

  const pos=pieces[colour][index];

  if(pos<0) return;

  const absolute=
    (startIndex[colour]+pos)%track.length;

  colours.forEach(other=>{

    if(other===colour) return;

    for(let i=0;i<4;i++){

      const otherPos=pieces[other][i];

      if(otherPos<0) continue;

      const otherAbsolute=
        (startIndex[other]+otherPos)%track.length;

      if(otherAbsolute===absolute){

        pieces[other][i]=-1;

      }

    }

  });

}


/* =========================
   WINNER
========================= */

function checkWinner(colour){

  /*
  Simple custom win condition:
  all four tokens must have completed the track.
  */

  const allHome=
    pieces[colour].every(
      p=>p>=track.length
    );

  if(allHome){

    winner=colour;

    document.getElementById("message").textContent=
      "🏆 "+colour+" WINS!";

    document.getElementById("roll").disabled=true;

  }

}

</script>

</body>
</html>
